<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kritik &amp; Saran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="kritik-saran.css">
    <link rel="stylesheet" href="journey.css">
</head>
<body>
    <main class="feedback-page">
        <a class="back-link" href="./index.html" aria-label="Kembali ke beranda"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>

        <section class="feedback-panel" aria-labelledby="feedbackTitle">
            <div class="feedback-panel__intro">
                <span class="eyebrow"><i class="fa-solid fa-message"></i> SUARA KAMU BERARTI</span>
                <h1 id="feedbackTitle">Kritik &amp; Saran</h1>
                <p>Sampaikan pengalaman, kritik, atau saran untuk membantu kami memperbaiki web ini.</p>
            </div>

            <form id="feedbackForm" class="feedback-form">
                <div class="field-group">
                    <label for="feedbackName">Nama <span aria-hidden="true">*</span></label>
                    <input id="feedbackName" name="name" type="text" autocomplete="name" placeholder="" required>
                </div>

                <div class="field-group">
                    <label for="feedbackProgram">Prodi <span aria-hidden="true">*</span></label>
                    <input id="feedbackProgram" name="program" type="text" placeholder="" required>
                </div>

                <div class="field-group field-group--full">
                    <label for="feedbackWhatsapp">Nomor WhatsApp untuk balasan <span aria-hidden="true">*</span></label>
                    <input id="feedbackWhatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="" required>
                </div>

                <div class="field-group field-group--full">
                    <label for="feedbackMessage">Kritik dan saran <span aria-hidden="true">*</span></label>
                    <textarea id="feedbackMessage" name="message" rows="7" placeholder="Tuliskan kritik dan saran kamu di sini..." required></textarea>
                </div>

                <div class="form-actions">
                    <button id="feedbackSubmit" type="submit"><i class="fa-solid fa-paper-plane"></i> Kirim Kritik &amp; Saran</button>
                    <p id="feedbackStatus" aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>

    <script src="site-config.js"></script>
    <script src="journey.js"></script>
    <script src="kritik-saran.js"></script>
</body>
</html>
